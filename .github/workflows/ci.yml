name: Application verification
on:
  push:
    branches: [master, feat/complete-inventory-application]
    paths: ['src/**','supabase/**','tests/**','scripts/**','package*.json','playwright.config.ts','.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_inventory_test
        ports: ['54322:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:54322/smart_inventory_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fresh migrations and database-role tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          psql "$DATABASE_TEST_URL" -v ON_ERROR_STOP=1 -f tests/database/bootstrap-role-context.sql
          for file in supabase/migrations/*.sql; do psql "$DATABASE_TEST_URL" -v ON_ERROR_STOP=1 -f "$file"; done
          npm run test:database 2>&1 | tee test-results/database.txt
      - name: Ledger-correct 1200-product and 50000-movement acceptance benchmark
        run: |
          set -euo pipefail
          npx tsx scripts/performance.ts 2>&1 | tee test-results/performance.log
      - name: Typecheck, lint, unit tests and production build
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee test-results/application.txt
      - name: Package offline development runtime
        if: always()
        run: |
          set -euo pipefail
          tar -czf /tmp/inventory-offline-runtime.tar.gz src tests scripts supabase node_modules package.json package-lock.json tsconfig.json next.config.ts eslint.config.mjs 2>/dev/null || tar -czf /tmp/inventory-offline-runtime.tar.gz src tests scripts supabase node_modules package.json package-lock.json tsconfig.json next.config.ts eslint.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-runtime-${{ github.sha }}
          path: /tmp/inventory-offline-runtime.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: test-results
          retention-days: 14
