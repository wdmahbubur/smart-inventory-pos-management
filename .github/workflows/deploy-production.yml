name: Deploy Smart Inventory to Vercel
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-production.yml'
      - 'scripts/deploy-production.mjs'
      - 'scripts/check-hosted-public.mjs'
      - 'tests/deployment/**'
      - 'config/deployment-target.json'
permissions:
  contents: read
concurrency:
  group: smart-inventory-production-release
  cancel-in-progress: false
jobs:
  access:
    name: Required deployment authorization
    if: github.repository == 'wdmahbubur/smart-inventory-pos-management' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail before building when deployment credentials are missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              printf '::error::Required repository Actions secret is missing: %s\n' "$name"
              printf -- '- %s: missing\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              printf -- '- %s: configured (value not displayed)\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if (( missing )); then
            echo '## NOT DEPLOYED — required authorization is missing' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add the named repository Actions secrets, then run this workflow on master. Never paste credentials into source, issues or chat.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Credentials are present; validity and approved targets are checked by the release script.' >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test deployment guards and mocked API orchestration
        run: node --test tests/deployment/*.test.mjs
      - name: Verify application without deployment credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run verify
      - name: Read-only hosted Auth and anonymous-denial checks
        run: node scripts/check-hosted-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-read-only-${{ github.sha }}
          path: test-results/hosted-public.json
          retention-days: 14
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Deploy exact verified commit and configure approved Auth callbacks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TEXT_MODEL: ${{ vars.OPENROUTER_TEXT_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-state-${{ github.sha }}
          path: test-results/deployment.json
          retention-days: 14
