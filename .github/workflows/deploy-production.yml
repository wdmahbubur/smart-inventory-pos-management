name: Deploy Smart Inventory to Vercel
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-production.yml'
      - 'scripts/deploy-production.mjs'
      - 'scripts/check-hosted-public.mjs'
      - 'tests/deployment/**'
      - 'config/deployment-target.json'
permissions:
  contents: read
concurrency:
  group: smart-inventory-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'wdmahbubur/smart-inventory-pos-management' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test deployment guards and mocked API orchestration
        run: node --test tests/deployment/*.test.mjs
      - name: Verify application without deployment credentials
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run verify
      - name: Read-only hosted Auth and anonymous-denial checks
        run: node scripts/check-hosted-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-read-only-${{ github.sha }}
          path: test-results/hosted-public.json
          retention-days: 14
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check deployment access
        id: access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" || -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::NOT DEPLOYED: add VERCEL_TOKEN and SUPABASE_ACCESS_TOKEN as repository Actions secrets, then run this workflow again.'
            echo '## NOT DEPLOYED — authorization required' >> "$GITHUB_STEP_SUMMARY"
            echo 'Application verification passed, but deployment was skipped. Set VERCEL_TOKEN and SUPABASE_ACCESS_TOKEN as repository Actions secrets and choose Run workflow on master. Never paste tokens into source, issues or chat.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy exact verified commit and configure approved Auth callbacks
        if: steps.access.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.access.outputs.configured == 'true'
        with:
          name: deployment-state-${{ github.sha }}
          path: test-results/deployment.json
          retention-days: 14
