name: Dependency bootstrap
on:
  workflow_dispatch:
  push:
    paths: ['package.json', '.github/workflows/dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts
      - name: Archive dependency tree for offline verification
        run: tar -czf dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: dependencies.tgz
          retention-days: 2
